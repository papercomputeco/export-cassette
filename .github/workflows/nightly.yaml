name: Nightly Build & Release

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  check:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: depot-ubuntu-24.04
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for new commits
        id: check
        run: |
          LAST_SHA=$(
            gh run list \
              --workflow nightly.yaml \
              --status success \
              --limit 1 \
              --json headSha -q '.[0].headSha' || echo ""
          )

          echo "Last successful build SHA: ${LAST_SHA:-none}"
          echo "Current SHA: ${{ github.sha }}"

          if [ "$LAST_SHA" = "${{ github.sha }}" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: depot-ubuntu-24.04-4
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to ECR Public
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
        with:
          registry-type: public

      - name: Move nightly tag up to HEAD
        run: |
          git tag -f nightly
          git push -f origin nightly

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push nightly image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ vars.REGISTRY }}/export-cassette:nightly
          cache-from: type=gha,scope=export-cassette
          cache-to: type=gha,mode=max,scope=export-cassette
          provenance: false
          sbom: false

      - name: Update nightly GitHub release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: nightly
          name: "Nightly Build & Release"
          body: |
            **Automated nightly build**

            This is an unstable development build off the tip of `main`.

            Commit: ${{ github.sha }}
            Image: `${{ vars.REGISTRY }}/export-cassette:nightly`
          prerelease: true
          allowUpdates: true
          makeLatest: false
          token: ${{ secrets.GITHUB_TOKEN }}
